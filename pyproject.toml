[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "musicgen"
version = "1.0.0"
description = "Music generation in ABC notation with a Transformer, an LSTM and an RNN, written from scratch in PyTorch."
readme = "README.md"
authors = [{ name = "Ismail Ben Alla", email = "ismailbenalla@gmail.com" }]
requires-python = ">=3.10"
keywords = [
  "music-generation", "abc-notation", "transformer", "lstm", "rnn",
  "pytorch", "language-model", "bpe-tokenizer", "symbolic-music", "irish-folk-music",
]
dependencies = [
  "numpy>=1.24",
  "regex>=2023.0",
  "torch>=2.2",
]

[project.optional-dependencies]
music = ["music21>=9.1", "pydub>=0.25"]  # ABC -> MIDI -> MP3
app = ["streamlit>=1.34", "music21>=9.1", "pydub>=0.25"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.9", "music21>=9.1", "matplotlib>=3.8"]

[project.scripts]
musicgen-train = "musicgen.train:main"
musicgen-generate = "musicgen.generate:main"
musicgen-tokenizer = "musicgen.train_tokenizer:main"

[project.urls]
Repository = "https://github.com/benisalla/musicgen"

[tool.hatch.build.targets.wheel]
packages = ["src/musicgen"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy"]
